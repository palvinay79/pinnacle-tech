<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: Pinnacle Chevron Peak with Tech Nodes -->
  <g transform="translate(10, 10)">
    <!-- Base Shadow / Outer Glow -->
    <path d="M 40 10 L 72 70 L 56 70 L 40 40 L 24 70 L 8 70 Z" fill="url(#logoGradient)" />
    <path d="M 40 25 L 58 60 L 48 60 L 40 45 L 32 60 L 22 60 Z" fill="url(#accentGradient)" opacity="0.9"/>
    <!-- Central Node -->
    <circle cx="40" cy="18" r="5" fill="#ffffff" />
    <circle cx="24" cy="70" r="4" fill="#06b6d4" />
    <circle cx="56" cy="70" r="4" fill="#2563eb" />
    <!-- Connector Lines -->
    <line x1="40" y1="18" x2="24" y2="70" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="40" y1="18" x2="56" y2="70" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  
  <!-- Brand Text -->
  <text x="100" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="30" fill="#0f172a" letter-spacing="-0.5">PINNACLE</text>
  <text x="252" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="30" fill="#2563eb" letter-spacing="1">TECH</text>
  
  <!-- Tagline below logo -->
  <text x="102" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="1.5">HOSTING • MAINTENANCE • SUPPORT</text>
</svg>
