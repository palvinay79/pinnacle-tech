  <text x="608" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399" font-weight="700">SYSTEMS ACTIVE</text>

  <!-- Left Sidebar Controls -->
  <rect x="60" y="110" width="180" height="430" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  
  <text x="80" y="140" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1">LIVE STATS</text>
  
  <!-- Stat Item 1: Uptime -->
  <rect x="75" y="155" width="150" height="65" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="90" y="175" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Cloud Uptime</text>
  <text x="90" y="202" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#10b981">99.99%</text>

  <!-- Stat Item 2: Speed Score -->
