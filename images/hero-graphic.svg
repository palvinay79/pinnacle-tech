  <rect x="305" y="325" width="390" height="50" rx="6" fill="#1e293b" />
  <circle cx="325" cy="350" r="12" fill="#065f46" />
  <text x="321" y="354" font-family="-apple-system, sans-serif" font-size="12" fill="#34d399" font-weight="bold">✓</text>
  <text x="350" y="343" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Updated Homepage Banner &amp; Contact Info</text>
  <text x="350" y="360" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Completed in 35 mins • Pinnacle Tech Support Team</text>

  <!-- Support Task 2 -->
  <rect x="305" y="385" width="390" height="50" rx="6" fill="#1e293b" />
  <circle cx="325" cy="410" r="12" fill="#065f46" />
  <text x="321" y="414" font-family="-apple-system, sans-serif" font-size="12" fill="#34d399" font-weight="bold">✓</text>
  <text x="350" y="403" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="600">PHP &amp; WordPress Core Security Patch</text>
  <text x="350" y="420" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Completed • Automated Maintenance Schedule</text>

  <!-- Support Task 3 -->
  <rect x="305" y="445" width="390" height="50" rx="6" fill="#1e293b" />
  <circle cx="325" cy="470" r="12" fill="#1e3a8a" />
  <text x="320" y="474" font-family="-apple-system, sans-serif" font-size="12" fill="#60a5fa" font-weight="bold">⚙</text>
  <text x="350" y="463" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Speed &amp; Image Compression Optimization</text>
  <text x="350" y="480" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8">In Progress • Active Optimization</text>
</svg>