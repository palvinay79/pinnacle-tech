  <text x="90" y="415" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Daily Backups</text>
  <text x="90" y="435" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Today 03:00 AM</text>
  <rect x="90" y="445" width="120" height="4" rx="2" fill="#10b981" />
  <text x="90" y="468" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Security Scan: Clean</text>
  <text x="90" y="488" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Updates: All Applied</text>

  <!-- Right Main Panel -->
  <rect x="260" y="110" width="480" height="430" rx="12" fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="1" />

  <!-- Main Chart Section -->
  <text x="285" y="140" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">TRAFFIC &amp; PERFORMANCE MONITOR</text>
  <text x="610" y="140" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">30-Day View</text>
  
  <!-- Simulated Curve Chart -->
  <path d="M 285 240 Q 340 210, 400 230 T 520 180 T 640 190 T 710 150 L 710 260 L 285 260 Z" fill="url(#primaryGrad)" fill-opacity="0.15" />
  <path d="M 285 240 Q 340 210, 400 230 T 520 180 T 640 190 T 710 150" fill="none" stroke="url(#primaryGrad)" stroke-width="3" />
  
  <!-- Active Nodes on Chart -->
  <circle cx="520" cy="180" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <circle cx="710" cy="150" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />

