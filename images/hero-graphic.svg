  <line x1="40" y1="90" x2="760" y2="90" stroke="#1e293b" stroke-width="2" />
  
  <!-- Window Controls -->
  <circle cx="70" cy="65" r="6" fill="#ef4444" />
  <circle cx="90" cy="65" r="6" fill="#f59e0b" />
  <circle cx="110" cy="65" r="6" fill="#10b981" />
  
  <!-- Address Bar Simulation -->
  <rect x="140" y="53" width="380" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="160" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981" font-weight="600">🔒 https://yourbusiness.com</text>
  <text x="350" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">[Managed by Pinnacle Tech]</text>

